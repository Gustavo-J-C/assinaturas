<!DOCTYPE html>
<html dir="ltr" lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="keywords" content="wrappixel, admin dashboard, html css dashboard, web dashboard, bootstrap 5 admin, bootstrap 5, css3 dashboard, bootstrap 5 dashboard, nice admin bootstrap 5 dashboard, frontend, responsive bootstrap 5 admin template, " />
  <meta name="robots" content="noindex,nofollow" />
  <title>ACEADEB</title>
  <link rel="canonical" href="https://www.wrappixel.com/templates/niceadmin/" />
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon.png" />
  <link href="../dist/css/style.min.css" rel="stylesheet" />
</head>

<body>
  <div class="main-wrapper">
    <div class="auth-wrapper d-flex no-block justify-content-center align-items-center"
      style="background: url(../assets/images/background/login-register.jpg) no-repeat center center; background-size: cover;">
      <div class="auth-box p-4 bg-white rounded">
        <div id="loginform">
          <div class="logo">
            <h3 class="box-title mb-3">Login</h3>
          </div>
          <div class="row">
            <div class="col-12">
              <form class="form-horizontal mt-3 form-material" id="loginform">
                <div class="form-group mb-3">
                  <div class="">
                    <input class="form-control" type="text" id="cpf" required="" placeholder="CPF" />
                  </div>
                </div>
                <div class="form-group mb-4">
                  <div class="">
                    <input class="form-control" type="password" id="password" required="" placeholder="Senha" />
                  </div>
                </div>
                <div class="form-group text-center mt-4 mb-3">
                  <div class="col-xs-12">
                    <button class="btn btn-info d-block w-100 waves-effect waves-light" type="submit">Entrar</button>
                  </div>
                </div>
              </form>
              <div id="error-message" style="color: red; text-align: center;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../dist/libs/jquery/dist/jquery.min.js"></script>
  <script src="../dist/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginform').addEventListener('submit', function(event) {
      event.preventDefault();

      const cpf = document.getElementById('cpf').value;
      const password = document.getElementById('password').value;

      fetch('login.php', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ login: cpf, password: password })
      })
      .then(response => response.json())
      .then(data => {
        if (data.token) {
          // Save user data in localStorage
          localStorage.setItem('userData', JSON.stringify(data));
          console.log(data);
          localStorage.setItem('jwtToken', data.token);

          if (data.admin) {
            window.location.href = 'admin.php';
          } else {
            window.location.href = 'form.php'; 
          }
        } else {
          document.getElementById('error-message').innerText = 'Dados inválidos. Verifique seu CPF e senha.';
        }
      })
      .catch(error => {
        document.getElementById('error-message').innerText = 'Erro no servidor. Tente novamente mais tarde.';
        console.error('Error:', error);
      });
    });
  </script>
</body>
</html>
